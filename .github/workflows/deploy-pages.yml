name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Also triggered by the content repo (notify-site.yml) after the studio panel saves.
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      HAS_CONTENT_TOKEN: ${{ secrets.CONTENT_READ_TOKEN != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Without the secret the site still builds, just with an empty gallery.
      - name: Checkout content
        if: env.HAS_CONTENT_TOKEN == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ vars.CONTENT_REPO || 'ashkansabbaghi/sara-ranjbar-content' }}
          token: ${{ secrets.CONTENT_READ_TOKEN }}
          path: .content
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # pregenerate validates the content and re-encodes every image; a bad upload fails here
      # and the previous deploy stays live.
      - name: Generate static site
        run: npm run generate
        env:
          NUXT_APP_BASE_URL: /sara-ranjbar/
          NITRO_PRESET: github_pages
          NUXT_PUBLIC_SITE_URL: https://ashkansabbaghi.github.io/sara-ranjbar
          NUXT_PUBLIC_WHATSAPP: 989381482799
          NUXT_PUBLIC_PHONE: 989381482799
          NUXT_PUBLIC_INSTAGRAM: __sararanjbar
          NUXT_PUBLIC_CONTENT_REPO: ${{ vars.CONTENT_REPO || 'ashkansabbaghi/sara-ranjbar-content' }}

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: .output/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
